plugins {
	id 'java'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(11)
	}
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.customnpcmodels.CustomNpcModelsPluginTest'

dependencies {
	compileOnly "net.runelite:client:$runeLiteVersion"

    compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'
	testCompileOnly 'org.projectlombok:lombok:1.18.30'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	// Test-only. Stand-in renderers and client objects, which only a mock can supply
	testImplementation 'org.mockito:mockito-core:4.11.0'
	testImplementation "net.runelite:client:$runeLiteVersion"
    testImplementation "net.runelite:jshell:$runeLiteVersion"
    // Dev tooling only - decodes the live OSRS cache for the glTF exporter and for the sequence
	// metadata the generator samples clips against. Not in the Hub jar, which is built from the
	// main sourceSet and does not reference it.
	testImplementation("net.runelite:cache:$runeLiteVersion") {
		// The client already brings logback; without this every run warns about two bindings
		exclude group: 'org.slf4j', module: 'slf4j-simple'
	}
}

group = 'com.customnpcmodels'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "--add-opens=java.base/java.lang=ALL-UNNAMED",
			"--add-opens=java.base/java.lang.reflect=ALL-UNNAMED",
			"--add-opens=java.base/java.util=ALL-UNNAMED",
			"--add-exports=java.base/sun.security.action=ALL-UNNAMED",
			"--add-exports=java.desktop/sun.awt=ALL-UNNAMED",
			"--add-exports=java.desktop/sun.font=ALL-UNNAMED",
			"-ea"
	args "--developer-mode", "--debug", "--disable-telemetry"

	// Points the Custom Model Hub at a test server, eg the one serveHubFixture runs. The plugin only
	// honours this in developer mode, which this task always is.
	if (project.hasProperty('hubUrl')) {
		systemProperty 'customnpcmodels.hubUrl', project.property('hubUrl')
	}
}

// Prints NPC definitions from the live OSRS cache - model ids, recolors, scale and the sequences
// an authored model has to be keyed to, eg:
//   ./gradlew dumpNpcDefinitions -Pnpc=5779
//   ./gradlew dumpNpcDefinitions -Pnpc="giant mole" -PcacheDir=/path/to/LIVE
tasks.register('dumpNpcDefinitions', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.customnpcmodels.cache.ModernNpcDumper'
	workingDir = rootDir

	if (project.hasProperty('npc')) {
		args project.property('npc').toString().split(',')
	}
	if (project.hasProperty('cacheDir')) {
		systemProperty 'customnpcmodels.cacheDir', project.property('cacheDir')
	}
	if (project.hasProperty('max')) {
		systemProperty 'customnpcmodels.maxMatches', project.property('max')
	}
}

// Exports an NPC from the live cache as a .glb plus a manifest stub, to seed Blender work or to
// round-trip an asset that already animates correctly. Without -Pseqs it takes every
// sequence on the NPC's rig (only the definition's own on a widely shared rig such as the humanoid's), eg:
//   ./gradlew exportGltf -Pnpc=5779
//   ./gradlew exportGltf -Pnpc=5779 -Pseqs=3309,3313 -Pout=assets-dev
tasks.register('exportGltf', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.customnpcmodels.authoring.GltfExporter'
	workingDir = rootDir

	if (project.hasProperty('npc')) {
		systemProperty 'customnpcmodels.npc', project.property('npc')
	}
	if (project.hasProperty('seqs')) {
		systemProperty 'customnpcmodels.seqs', project.property('seqs')
	}
	if (project.hasProperty('out')) {
		systemProperty 'customnpcmodels.out', project.property('out')
	}
	if (project.hasProperty('cacheDir')) {
		systemProperty 'customnpcmodels.cacheDir', project.property('cacheDir')
	}
}

// Reports how far a .glb - typically one re-exported from Blender - has moved from the NPC it came
// from: converter warnings, moved vertex groups, recolored faces and per-sequence pose error, eg:
//   ./gradlew compareGltf -Pnpc=5779 -Pglb=assets-dev/giant-mole.glb
//   ./gradlew compareGltf -Pnpc=5779 -Pglb=assets-dev/giant-mole.glb -Pseqs=3309,3313
tasks.register('compareGltf', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.customnpcmodels.authoring.GltfComparer'
	workingDir = rootDir

	if (project.hasProperty('npc')) {
		systemProperty 'customnpcmodels.npc', project.property('npc')
	}
	if (project.hasProperty('glb')) {
		systemProperty 'customnpcmodels.glb', project.property('glb')
	}
	if (project.hasProperty('seqs')) {
		systemProperty 'customnpcmodels.seqs', project.property('seqs')
	}
	if (project.hasProperty('cacheDir')) {
		systemProperty 'customnpcmodels.cacheDir', project.property('cacheDir')
	}
}

// Opens a .glb in a window for painting face colors, then saves it back in place - keeping the
// original as <file>.bak - with nothing but the colors changed. Without -Pglb it asks for a file, eg:
//   ./gradlew paintGltf -Pglb=assets-dev/giant-mole.glb
tasks.register('paintGltf', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.customnpcmodels.authoring.GltfPainter'
	workingDir = rootDir

	if (project.hasProperty('glb')) {
		systemProperty 'customnpcmodels.glb', project.property('glb')
	}
}

// Plays a .glb's animations as the game will draw them: each sampled at its live sequence's frames
// and posed by the plugin's skinner, lit at rest and scaled and recolored as models.json says. Reads
// sequence timings from the live cache. -Pglb may name a folder, which opens every .glb directly in
// it as tabs (Ctrl+Page Up / Page Down or Ctrl+Tab between them). Without -Pglb it asks for one or
// more files, eg:
//   ./gradlew viewAnimations -Pglb=assets-dev/giant-mole.glb
//   ./gradlew viewAnimations -Pglb=assets-dev
tasks.register('viewAnimations', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.customnpcmodels.authoring.GltfAnimationViewer'
	workingDir = rootDir

	if (project.hasProperty('glb')) {
		systemProperty 'customnpcmodels.glb', project.property('glb')
	}
	if (project.hasProperty('cacheDir')) {
		systemProperty 'customnpcmodels.cacheDir', project.property('cacheDir')
	}
}

// Puts a .glb's animations on another NPC's sequences: each output animation copies the source
// the mapping names, renamed after its target sequence and spread over that sequence's live length
// (looped first when the mapping says so). Reads sequence timings from the live cache, eg:
//   ./gradlew retargetGltf -Pglb=crab.glb -Pmap=spider-map.json -Pout=crab-as-spider.glb
tasks.register('retargetGltf', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.customnpcmodels.authoring.GltfRetargeter'
	workingDir = rootDir

	if (project.hasProperty('glb')) {
		systemProperty 'customnpcmodels.glb', project.property('glb')
	}
	if (project.hasProperty('map')) {
		systemProperty 'customnpcmodels.map', project.property('map')
	}
	if (project.hasProperty('out')) {
		systemProperty 'customnpcmodels.out', project.property('out')
	}
	if (project.hasProperty('cacheDir')) {
		systemProperty 'customnpcmodels.cacheDir', project.property('cacheDir')
	}
}

// Builds the asset bundle from the authoring manifest (models.json) and the .glb files beside it.
// Reads no geometry from any cache - only the live sequences' frame counts and lengths, which the
// clips are sampled against. -Pdev writes the gitignored dev bundle on the test classpath instead
// of the shipped one; -PpackOut writes a pack (bundle.dat and pack.json) to the given directory, or
// build/packs/<pack id> when none is given, eg:
//   ./gradlew generateAssets
//   ./gradlew generateAssets -PassetsDir=assets-dev -Pdev
//   ./gradlew generateAssets -PassetsDir=my-pack -PpackOut
tasks.register('generateAssets', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.customnpcmodels.authoring.AssetGenerator'
	workingDir = rootDir

	if (project.hasProperty('assetsDir')) {
		systemProperty 'customnpcmodels.assetsDir', project.property('assetsDir')
	}
	if (project.hasProperty('dev')) {
		systemProperty 'customnpcmodels.dev', 'true'
	}
	if (project.hasProperty('packOut')) {
		systemProperty 'customnpcmodels.packOut', project.property('packOut')
	}
	if (project.hasProperty('cacheDir')) {
		systemProperty 'customnpcmodels.cacheDir', project.property('cacheDir')
	}
}

// Writes build/fixtures/blacklisted-pack: the dev bundle's models, also bound to TzKal-Zuk, for
// checking in game that the plugin refuses a blacklisted NPC - which generateAssets never builds
tasks.register('writeBlacklistFixture', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.customnpcmodels.packs.BlacklistFixture'
	workingDir = rootDir
}

// Serves a test Custom Model Hub on localhost:8765, built from the dev bundle, for trying the hub
// client in game before the real hub exists; pair with ./gradlew run -PhubUrl=http://localhost:8765/.
// -Prevision=2 gives its pack a new commit, so an installed copy shows an update.
tasks.register('serveHubFixture', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.customnpcmodels.packs.HubFixture'
	workingDir = rootDir

	if (project.hasProperty('revision')) {
		systemProperty 'customnpcmodels.revision', project.property('revision')
	}
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
